name: DiveMeets Scraper

on:
  schedule:
    - cron: '0 6 * * *'  # Runs daily at 6am UTC
  workflow_dispatch:      # Allow manual triggering

jobs:
  scrape-usa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scraper repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run USA scraper
        run: python scraper.py --org usa

      - name: Upload USA database
        uses: actions/upload-artifact@v4
        with:
          name: usa-db
          path: data/usa_*.db

  scrape-ncaa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout scraper repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run NCAA scraper
        run: python scraper.py --org ncaa

      - name: Upload NCAA database
        uses: actions/upload-artifact@v4
        with:
          name: ncaa-db
          path: data/ncaa_*.db

  build-and-push:
    runs-on: ubuntu-latest
    needs: [scrape-usa, scrape-ncaa]
    steps:
      - name: Checkout scraper repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Download USA database
        uses: actions/download-artifact@v4
        with:
          name: usa-db
          path: data/

      - name: Download NCAA database
        uses: actions/download-artifact@v4
        with:
          name: ncaa-db
          path: data/

      - name: Build JS data files
        run: python build_data_js.py

      - name: Checkout apps repo
        uses: actions/checkout@v4
        with:
          repository: mjretcher/usa-diving-staff-apps
          token: ${{ secrets.APPS_REPO_TOKEN }}
          path: apps-repo

      - name: Copy JS files to apps repo
        run: |
          cp js/data_*.js apps-repo/js/

      - name: Commit and push to apps repo
        working-directory: apps-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add js/data_*.js
          git diff --staged --quiet || git commit -m "Auto-update dive data $(date -u '+%Y-%m-%d')"
          git push
