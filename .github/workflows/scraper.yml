name: DiveMeets Scraper

on:
  schedule:
    - cron: '0 10 * * 3'   # Weekly, Wednesdays 10 AM UTC (results posted by then)
  workflow_dispatch:        # Manual trigger from Actions tab

jobs:
  scrape-usa:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run USA scraper (meets + events + results, skip dive sheets)
        run: python -m scraper.main --year 2026 --org usa --no-dive-sheets

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/usa_2026.db
          git diff --staged --quiet || git commit -m "scrape: update usa_2026.db $(date -u '+%Y-%m-%d')"
          git push

      - name: Trigger junior data rebuild
        run: |
          curl -s -X POST \
            -H "Authorization: Bearer ${{ secrets.STAFF_APPS_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/mjretcher/usa-diving-staff-apps/dispatches \
            -d '{"event_type":"scrape-complete","client_payload":{"source":"divemeets-scraper","date":"'"$(date -u '+%Y-%m-%d')"'"}}'

  scrape-ncaa:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run NCAA scraper (meets + events + results, skip dive sheets)
        run: python -m scraper.main --year 2026 --org ncaa --no-dive-sheets

      - name: Commit updated database
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/ncaa_2026.db
          git diff --staged --quiet || git commit -m "scrape: update ncaa_2026.db $(date -u '+%Y-%m-%d')"
          git push
